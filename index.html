<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quick Choice</title>

<style>
  * {
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
  }

  body {
    height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #14142b, #2c2c54);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .card {
    width: 420px;
    height: 260px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    text-align: center;
    padding: 30px;
    color: white;
    position: relative;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.9);
  }

  h1 {
    margin-bottom: 40px;
    font-weight: 600;
  }

  button {
    padding: 12px 28px;
    font-size: 16px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
  }

  #yes {
    background: linear-gradient(135deg, #00ffcc, #00c6ff);
    color: #000;
    margin-right: 10px;
  }

  #no {
    background: linear-gradient(135deg, #ff4b5c, #ff1e56);
    color: white;
    position: relative; /* normal flow */
    margin-left: 10px; /* space from Yes button */
    transition: left 0.15s ease, top 0.15s ease;
  }

  /* SECOND UI */
  .success h1 {
    margin-bottom: 10px;
  }

  .success p {
    opacity: 0.8;
    font-size: 15px;
  }
</style>
</head>

<body>

<!-- FIRST UI -->
<div class="card" id="choiceCard">
  <h1>Bobo kaba ya?</h1>
  <button id="yes">Yes</button>
  <button id="no">No</button>
</div>

<!-- SECOND UI -->
<div class="card hidden success" id="successCard">
  <h1>Alam ko naman sinusubukan kalang</h1>
  <p>Don't deny it next time😌</p>
</div>

<script>
  const noBtn = document.getElementById("no");
  const card = document.getElementById("choiceCard");
  const yesBtn = document.getElementById("yes");
  const successCard = document.getElementById("successCard");

  let dodgeLevel = 40;

  document.addEventListener("mousemove", (e) => {
    const rect = noBtn.getBoundingClientRect();
    const dx = e.clientX - (rect.left + rect.width / 2);
    const dy = e.clientY - (rect.top + rect.height / 2);
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < dodgeLevel) {
      moveNo();
      dodgeLevel += 5;
    }
  });

  function moveNo() {
    // switch to absolute when dodging
    noBtn.style.position = "absolute";

    const maxX = card.clientWidth - noBtn.clientWidth;
    const maxY = card.clientHeight - noBtn.clientHeight;

    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";
  }

  yesBtn.addEventListener("click", () => {
    card.classList.add("hidden");
    successCard.classList.remove("hidden");
  });
</script>

</body>
</html>
